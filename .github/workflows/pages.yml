name: Deploy Powderranger docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build docs
        run: |
          mkdir artifact
          Copy-Item -Recurse -Force "docs" "artifact"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
